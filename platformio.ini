; Rockey 硬件 Vault 固件构建配置
;
; 目标板：M5Stack Core BASIC v2.7 (ESP32-D0WDQ6 / ILI9341 320x240 / 三实体按钮 A,B,C)
; 构建系统：PlatformIO + Arduino-ESP32 2.0.17 (ESP-IDF 4.4.x) + TFT_eSPI 2.5.43
;
; 钱包固件不初始化任何无线外设（WiFi/BT 从未 enable）。
;
; 用法（推荐 scripts/build.sh，会自动填充构建 ID）：
;   pio run -e m5stack-core-zh-hans
;   pio run -e m5stack-core-zh-hans -t upload
;
; 语言 / 字体 / 字集只通过环境名选择；参数语义见 docs/冻结/构建配置矩阵.md
;   LANG         en | zh-Hans | zh-Hant | zh-Hk | ja
;   FONT_PROFILE builtin | noto-cjk | fusion-pixel
;   GLYPH_SET    ui | common | full

[platformio]
default_envs = m5stack-core-zh-hans
# mbedTLS 静态库位置（ESP-IDF SDK 随 Arduino-ESP32 提供，不单独下载）
extra_scripts = scripts/pio_espidf_libs.py
src_dir = src
include_dir = include

[common]
build_flags =
    -std=gnu++17
    -include include/User_Setup.h
    -D USER_SETUP_LOADED=1
    -D SPI_FREQUENCY=40000000
    -D F_CPU=240000000L
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_MODE=0
    -D ROCKEY_BOARD_M5STACK_CORE_BASIC_V27=1
    -D ROCKEY_WIRELESS_DISABLED=1
    -D ROCKEY_PARTITION_TABLE=\"partitions_rockey_v1\"
    -D ROCKEY_STRING_TABLE_H=\"i18n/strings.h\"
    ; ESP-IDF 自带 mbedTLS 2.28：SHA-256/HKDF/PBKDF2/AES-GCM/ChaCha20-Poly1305/ECP。
    ; Arduino 框架默认不链接 mbedTLS，这里显式指向 SDK 库目录。
    -lmbedtls -lmbedx509 -lmbedcrypto

[env]
platform = espressif32@6.12.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = partitions/partitions_rockey.csv
board_build.f_flash = 40000000L
board_build.flash_mode = qio
build_unflags = -std=gnu++11

; 依赖固定版本，构建脚本校验 sha256
lib_deps =
    bodmer/TFT_eSPI@2.5.43

; ── 语言档位 ──────────────────────────────────────────────────────────
[lang_en]
lang_flags =
    -D ROCKEY_LANG_EN=1
    -D ROCKEY_FONT_ASCII_BUILTIN=1
    -D ROCKEY_GLYPH_SET_UI=1

[lang_zh_hans]
lang_flags =
    -D ROCKEY_LANG_ZH_HANS=1
    -D ROCKEY_FONT_TABLE=1
    -D ROCKEY_FONT_PROFILE=\"fusion-pixel\"
    -D ROCKEY_GLYPH_SET_COMMON=1

[lang_zh_hant]
lang_flags =
    -D ROCKEY_LANG_ZH_HANT=1
    -D ROCKEY_FONT_TABLE=1
    -D ROCKEY_FONT_PROFILE=\"fusion-pixel\"
    -D ROCKEY_GLYPH_SET_COMMON=1

[lang_zh_hk]
lang_flags =
    -D ROCKEY_LANG_ZH_HK=1
    -D ROCKEY_FONT_TABLE=1
    -D ROCKEY_FONT_PROFILE=\"fusion-pixel\"
    -D ROCKEY_GLYPH_SET_COMMON=1

[lang_ja]
lang_flags =
    -D ROCKEY_LANG_JA=1
    -D ROCKEY_FONT_TABLE=1
    -D ROCKEY_FONT_PROFILE=\"fusion-pixel\"
    -D ROCKEY_GLYPH_SET_COMMON=1

; ── 配置档位 ──────────────────────────────────────────────────────────
[rel]
tier_flags =
    -D ROCKEY_BUILD_RELEASE=1
    -D LOG_LEVEL=1

[dev]
tier_flags =
    -D ROCKEY_BUILD_RELEASE=0
    -D ROCKEY_DEV_TEST_KEY=1
    -D ROCKEY_DEV_BUTTON_API=1
    -D LOG_LEVEL=3
build_type = debug

[rel_debug]
tier_flags =
    -D ROCKEY_BUILD_RELEASE=1
    -D LOG_LEVEL=3
build_type = debug

; ── 环境矩阵 ──────────────────────────────────────────────────────────
[env:m5stack-core-en]
build_flags = ${common.build_flags} ${lang_en.lang_flags} ${rel.tier_flags}

[env:m5stack-core-zh-hans]
build_flags = ${common.build_flags} ${lang_zh_hans.lang_flags} ${rel.tier_flags}

[env:m5stack-core-zh-hant]
build_flags = ${common.build_flags} ${lang_zh_hant.lang_flags} ${rel.tier_flags}

[env:m5stack-core-zh-hk]
build_flags = ${common.build_flags} ${lang_zh_hk.lang_flags} ${rel.tier_flags}

[env:m5stack-core-ja]
build_flags = ${common.build_flags} ${lang_ja.lang_flags} ${rel.tier_flags}

[env:m5stack-core-migration]
build_flags = ${common.build_flags} ${lang_zh_hans.lang_flags} ${rel.tier_flags} -D ROCKEY_GLYPH_SET_FULL=1 -D ROCKEY_FEATURE_MIGRATION=1

[env:m5stack-core-debug-zh-hans]
build_flags = ${common.build_flags} ${lang_zh_hans.lang_flags} ${rel_debug.tier_flags}

[env:m5stack-core-dev-zh-hans]
build_flags = ${common.build_flags} ${lang_zh_hans.lang_flags} ${dev.tier_flags}

[env:m5stack-core-dev-en]
build_flags = ${common.build_flags} ${lang_en.lang_flags} ${dev.tier_flags}